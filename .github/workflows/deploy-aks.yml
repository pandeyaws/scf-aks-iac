name: Deploy AKS
on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

concurrency:
  group: aks-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    environment: development
    env:
      ARM_CLIENT_ID: ${{ secrets.CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.TEENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check deployment configuration
        shell: bash
        run: |
          for setting in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::${setting} is empty. Set the matching CLIENT_ID, TENANT_ID, or SUBSCRIPTION_ID secret in the development GitHub environment."
              exit 1
            fi
          done

          for setting in TF_STATE_RESOURCE_GROUP TF_STATE_STORAGE_ACCOUNT TF_STATE_CONTAINER; do
            if [[ -z "${!setting}" || "${!setting}" == "$setting" ]]; then
              echo "::error::${setting} is unset or contains its variable name. Set it to the actual Azure Terraform state value in the development GitHub environment."
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          tenant-id: ${{ secrets.TEENANT_ID }}
          subscription-id: ${{ secrets.SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        run: |
          terraform -chdir=. init -input=false \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=dev.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: Validate Terraform
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Plan dev
        run: terraform plan -input=false -var-file=environments/dev.tfvars -out=dev.tfplan

      - name: Apply dev
        run: terraform apply -input=false -auto-approve dev.tfplan

